version: 1
disable_existing_loggers: False
formatters:
  default:
    format: "%(message)s"
  custom:
    format: "%(name)s :: %(levelname)-8s :: %(message)s"
handlers:
  stderr:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
    level: ERROR
  stdout:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stdout
    level: INFO
    filters:
      - info_and_below

filters:
  info_and_below:
    (): src.common.config.app_config.filter_maker
    level: INFO

loggers:
  cvs_event_logger:
    level: INFO
    handlers:
      - stderr
      - stdout
    propagate: no

  uvicorn.error:
    level: INFO
    handlers:
      - stderr
      - stdout
    propagate: no

root:
  level: ERROR
  handlers:
    - stderr
    - stdout
  propagate: no
